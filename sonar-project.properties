sonar.projectKey=collector-hub-static-site
sonar.projectName=Collector Hub Static Site
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.inclusions=**/*.html,assets/js/**/*.js,assets/css/**/*.css,templatemo-*.css,templatemo-*.js
sonar.exclusions=vendor/**,node_modules/**,reports/**,playwright-report/**,test-results/**
sonar.test.inclusions=tests/**/*.test.js

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.testExecutionReportPaths=reports/sonar/test-execution.xml
